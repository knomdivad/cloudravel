# ============================================================================
# AnanVision — local / OrbStack stack (runs anywhere: no Azure-only services)
#
#   cp .env.example .env      # set MSSQL_SA_PASSWORD; the rest have working defaults
#   docker compose up --build
#
#   Web UI  → http://localhost:3000   (log in with the seeded local admin:
#                                       username 'admin', password 'ChangeMe123!')
#   API     → http://localhost:7071/api/health
#   OpenBao → http://localhost:8200   (dev mode, root token 'root')
#
# Cloud-agnostic by design:
#   secrets  → OpenBao (self-hosted, Vault-API-compatible) instead of Key Vault
#   auth     → local username/password (Entra ID optional, not required)
#   job queue→ DatabaseJobQueue (SQL table) instead of Service Bus
# ============================================================================

name: ananvision

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Cloud-agnostic secret store (Vault-API-compatible). Dev mode keeps secrets
  # in memory with a fixed root token — fine for local; use a real OpenBao/Vault
  # with persistent storage and proper auth in production.
  openbao:
    image: openbao/openbao:latest
    command: server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_DEV_ROOT_TOKEN_ID: root
      BAO_ADDR: http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"

  # Azure Storage emulator — the Functions host requires AzureWebJobsStorage for
  # timer-trigger scheduling (used by the AIOps timers), even with no real Azure.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

  # Applies database/001–006 + demo seed once each (dbo.__migrations ledger),
  # so `docker compose up` is safe to re-run and picks up new migrations.
  migrator:
    image: mcr.microsoft.com/mssql-tools:latest
    platform: linux/amd64
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./database:/database:ro
    command: ["bash", "/database/apply-migrations.sh"]
    restart: "no"

  api:
    # src/backend/Dockerfile builds natively (fast) and pins only the runtime
    # stage to amd64 (the Functions base image is amd64-only), so no service-
    # level platform override is needed here.
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    depends_on:
      mssql:
        condition: service_healthy
      azurite:
        condition: service_started
      openbao:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    environment:
      # --- Functions runtime ---
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1"
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      # --- Database (also backs the DatabaseJobQueue — no Service Bus needed) ---
      SqlConnectionString: "Server=mssql,1433;Database=aimdb;User ID=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      # --- Secret store: OpenBao (cloud-agnostic) ---
      OpenBao__Address: "http://openbao:8200"
      OpenBao__Token: ${OPENBAO_TOKEN:-root}
      # --- Local auth signing key (required for the non-Entra login path) ---
      LocalAuth__JwtSigningKey: ${LOCAL_AUTH_JWT_SIGNING_KEY:-dev-only-change-me-in-production}
      # --- AI model: any OpenAI-compatible endpoint (optional) ---
      AzureOpenAI__Endpoint: ${AZURE_OPENAI_ENDPOINT:-}
      AzureOpenAI__ApiKey: ${AZURE_OPENAI_API_KEY:-}
      AzureOpenAI__DeploymentName: ${AZURE_OPENAI_DEPLOYMENT:-gpt-5.5}
      # --- Entra ID SSO (optional — local login works without it) ---
      AzureAd__TenantId: ${AZURE_AD_TENANT_ID:-}
      AzureAd__ClientId: ${AZURE_AD_CLIENT_ID:-}
      # --- Disable cloud-credential-dependent sync timers for local dev. ---
      # AnomalyScanTimer, RemediationQueueTimer and SnapshotIngestionQueueTimer
      # (DB-driven) stay ENABLED so Operations/Approvals are live.
      AzureWebJobs.PollChangesTimer.Disabled: "true"
      AzureWebJobs.SyncAdvisorTimer.Disabled: "true"
      AzureWebJobs.SyncPolicyTimer.Disabled: "true"
      AzureWebJobs.SyncDefenderTimer.Disabled: "true"
      AzureWebJobs.CollectInventoryTimer.Disabled: "true"
      AzureWebJobs.MultiCloudInventoryTimer.Disabled: "true"
    ports:
      - "7071:80"

  web:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        # Entra values are optional — provide them only to enable Entra SSO
        # alongside local login.
        NEXT_PUBLIC_AZURE_AD_CLIENT_ID: ${NEXT_PUBLIC_AZURE_AD_CLIENT_ID:-}
        NEXT_PUBLIC_AZURE_AD_TENANT_ID: ${NEXT_PUBLIC_AZURE_AD_TENANT_ID:-}
        NEXT_PUBLIC_API_SCOPE: ${NEXT_PUBLIC_API_SCOPE:-}
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:80"

volumes:
  mssql-data:
  azurite-data:
