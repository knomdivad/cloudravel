# ============================================================================
# CloudRavel — local / OrbStack stack (runs anywhere: no Azure-only services)
#
#   cp .env.example .env      # set MSSQL_SA_PASSWORD; the rest have working defaults
#   make up                   # build + start DETACHED (safe to close the shell)
#
#   Plain Compose stays attached unless you detach yourself:
#     docker compose up -d --build      # same thing without make
#     docker compose logs -f            # follow logs; Ctrl-C leaves the stack up
#     docker compose down               # stop everything
#
#   Web UI  → http://localhost:3000   (log in with the seeded local admin:
#                                       email 'admin@local', password 'ChangeMe123!')
#   API     → http://localhost:7071/api/health
#   OpenBao → http://localhost:8200   (dev mode, root token 'root')
#
# Cloud-agnostic by design:
#   secrets  → OpenBao (self-hosted, Vault-API-compatible) instead of Key Vault
#   auth     → local username/password (Entra ID optional, not required)
#   job queue→ DatabaseJobQueue (SQL table) instead of Service Bus
# ============================================================================

services:
  # Azure SQL Edge — arm64-native (no emulation on Apple Silicon) and the same
  # engine the schema targets (RLS, SESSION_CONTEXT). Readiness is handled by the
  # migrator's own connection-retry loop, so there's no in-image sqlcmd healthcheck.
  mssql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  # Cloud-agnostic secret store (Vault-API-compatible).
  # Default: file storage under openbao-data (survives container restarts).
  # Set OPENBAO_MODE=dev for the old in-memory -dev server (ephemeral secrets).
  openbao:
    image: docker.io/openbao/openbao:latest
    # Persistent mode uses deploy/openbao/entrypoint.sh + config.hcl.
    # Dev mode: in-memory, token always "root" (OPENBAO_TOKEN default).
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ "$${OPENBAO_MODE:-file}" = "dev" ]; then
          exec bao server -dev -dev-root-token-id=$${OPENBAO_TOKEN:-root} -dev-listen-address=0.0.0.0:8200
        fi
        tr -d '\015' < /openbao/config/entrypoint.sh > /tmp/openbao-entrypoint.sh
        exec sh /tmp/openbao-entrypoint.sh
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      OPENBAO_MODE: ${OPENBAO_MODE:-file}
      OPENBAO_ROOT_TOKEN: ${OPENBAO_TOKEN:-root}
      OPENBAO_CONFIG: /openbao/config/config.hcl
      OPENBAO_DATA_DIR: /openbao/data
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      - openbao-data:/openbao/data
      - ./deploy/openbao:/openbao/config:ro
    healthcheck:
      test: ["CMD-SHELL", "bao status >/dev/null 2>&1 || vault status >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Azure Storage emulator — the Functions host requires AzureWebJobsStorage for
  # timer-trigger scheduling (used by the AIOps timers), even with no real Azure.
  # No host ports: only the api container reaches it, over the internal network.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    volumes:
      - azurite-data:/data

  # Applies schema migrations once each (dbo.__migrations ledger). Leaves a
  # blank estate plus the bootstrap local admin (admin@local / ChangeMe123!) —
  # no Contoso demo seed. Optional: sqlcmd seed-demo-data.sql by hand.
  migrator:
    # Prefer host-mounted database/ SQL (includes latest migrations). Image is
    # only the sqlcmd tooling base; scripts always come from ./database.
    image: mcr.microsoft.com/mssql-tools:latest
    platform: linux/amd64
    depends_on:
      mssql:
        condition: service_started
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./database:/database:ro
    # Strip any CR (a CRLF checkout on the host would otherwise make bash reject
    # the script) before executing. Belt-and-suspenders with .gitattributes.
    command: ["bash", "-c", "tr -d '\\015' < /database/apply-migrations.sh | bash"]
    restart: "no"

  api:
    # Pin a local image name so `compose up --build` cannot silently keep an
    # old ghcr.io/...:latest from a prior image: override (which caused 404s
    # on routes that only exist in this tree).
    image: cloudravel-api:local
    # src/backend/Dockerfile builds natively (fast) and pins only the runtime
    # stage to amd64 (the Functions base image is amd64-only), so no service-
    # level platform override is needed here.
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      args:
        # The build context has no .git dir, so this is how the version shown
        # in the UI gets a commit SHA for local/OrbStack builds too. Set
        # GIT_SHA in your shell/.env (e.g. `export GIT_SHA=$(git rev-parse --short HEAD)`)
        # before `docker compose build`; omitted is fine (bare semver, no commit).
        GIT_SHA: ${GIT_SHA:-}
    depends_on:
      mssql:
        condition: service_started
      azurite:
        condition: service_started
      openbao:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      # --- Functions runtime ---
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1"
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      # --- Instance environment: Development disables all inventory collection
      #     (scheduled AND on-demand) so the fake seed clouds are never contacted.
      #     Set to Production when onboarding real clouds. ---
      Platform__Environment: ${PLATFORM_ENVIRONMENT:-Development}
      # --- Database (also backs the DatabaseJobQueue — no Service Bus needed) ---
      SqlConnectionString: "Server=mssql,1433;Database=cloudraveldb;User ID=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      # --- Secret store: OpenBao (cloud-agnostic) ---
      # Leave OPENBAO_TOKEN empty for file mode so the API reads TokenFile.
      # Set OPENBAO_TOKEN=root only with OPENBAO_MODE=dev.
      OpenBao__Address: "http://openbao:8200"
      OpenBao__Token: ${OPENBAO_TOKEN:-}
      OpenBao__TokenFile: /openbao-data/.cloudravel-root-token
      # --- Local auth signing key (required for the non-Entra login path) ---
      LocalAuth__JwtSigningKey: ${LOCAL_AUTH_JWT_SIGNING_KEY:-dev-only-change-me-in-production}
      # CORS allow-list (comma-separated). Browser SPA origin only — no wildcard.
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SecretStore__Provider: OpenBao
      # --- AI model: any OpenAI-compatible endpoint (optional). These are the
      #     ENV-VAR FALLBACK; a system admin can override them at runtime under
      #     Admin → System Settings (stored in system_settings + secret store).
      #     Keys match what the code reads (OpenAI:BaseUrl/ApiKey/Model). ---
      OpenAI__BaseUrl: ${OPENAI_BASE_URL:-}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-5.5}
      # --- Entra ID SSO (optional — local login works without it) ---
      AzureAd__TenantId: ${AZURE_AD_TENANT_ID:-}
      AzureAd__ClientId: ${AZURE_AD_CLIENT_ID:-}
      # --- Change-polling / recommendation-sync timers hit live cloud APIs and
      #     need real credentials, so keep them off locally. The inventory timers
      #     (CollectInventoryTimer, MultiCloudInventoryTimer) stay ENABLED — they
      #     are the internal scheduler and self-skip in Development. AnomalyScan,
      #     RemediationQueue and SnapshotIngestionQueue (DB-driven) also stay on. ---
      AzureWebJobs.PollChangesTimer.Disabled: "true"
      AzureWebJobs.SyncAdvisorTimer.Disabled: "true"
      AzureWebJobs.SyncPolicyTimer.Disabled: "true"
      AzureWebJobs.SyncDefenderTimer.Disabled: "true"
    volumes:
      # Root token written by persistent OpenBao entrypoint (file mode).
      - openbao-data:/openbao-data:ro
    ports:
      - "7071:80"

  web:
    image: cloudravel-web:local
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        # Entra values are optional — provide them only to enable Entra SSO
        # alongside local login.
        NEXT_PUBLIC_AZURE_AD_CLIENT_ID: ${NEXT_PUBLIC_AZURE_AD_CLIENT_ID:-}
        NEXT_PUBLIC_AZURE_AD_TENANT_ID: ${NEXT_PUBLIC_AZURE_AD_TENANT_ID:-}
        NEXT_PUBLIC_API_SCOPE: ${NEXT_PUBLIC_API_SCOPE:-}
    depends_on:
      api:
        condition: service_started
    environment:
      # nginx reverse-proxy upstream (envsubst'd into the config at startup).
      # Same var Kubernetes sets to the api Service name; here it's the compose
      # service. Matches the image default, set explicitly for clarity.
      API_UPSTREAM: api:80
    ports:
      - "3000:80"

volumes:
  mssql-data:
  azurite-data:
  openbao-data:
