# Verification overlay for Cloud Agent VMs where Azure SQL Edge accepts host
# port 1433 but not in-network connections to the mssql service IP.
# Routes migrator + API through the published host port via host-gateway.
services:
  migrator:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: host.docker.internal
    volumes:
      - ${VERIFY_DB_MOUNT:-./database}:/database:ro

  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SqlConnectionString: "Server=host.docker.internal,${MSSQL_HOST_PORT:-1433};Database=cloudraveldb;User ID=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"

  # The Functions host in the api image often binds HTTP on IPv6 only, so other
  # containers cannot reach api:80 over the compose bridge (504 on /api/*). Proxy
  # through the published host port instead (same path curl uses on the VM).
  web:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Use the docker bridge gateway IP (not host.docker.internal): nginx resolves
      # $api_upstream via 127.0.0.11 and ignores /etc/hosts, which breaks host-gateway names.
      API_UPSTREAM: 172.17.0.1:${API_HOST_PORT:-7071}
