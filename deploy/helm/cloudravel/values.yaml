# ============================================================================
# CloudRavel Helm chart values
#
# Out of the box (all bundled deps enabled) this stands the full stack up on a
# bare cluster. For production, disable a bundled dep and point at an external
# managed service via the matching `external*` block.
#
# REQUIRED before install: set `secrets.mssqlSaPassword` and
# `secrets.localAuthJwtSigningKey` (or supply `secrets.existingSecret`).
# ============================================================================

# Prefix for all resource names. Defaults to the release name; override to pin.
nameOverride: ""
fullnameOverride: ""

# -- Images. Tags default to the chart's appVersion when left blank. --
image:
  registry: ghcr.io/knomdivad
  pullPolicy: IfNotPresent
  # Overrides applied per component below; blank tag => chart appVersion.
  api:
    repository: cloudravel-api
    tag: ""
  web:
    repository: cloudravel-web
    tag: ""
  migrator:
    repository: cloudravel-migrator
    tag: ""

# Image pull secrets for private registries (GHCR packages, etc.).
imagePullSecrets: []
# - name: ghcr-pull

# ---------------------------------------------------------------------------
# Service account. One per release instead of `default`, so these workloads can
# be named in RBAC and admission policy. Nothing here calls the Kubernetes API,
# so the token is not mounted.
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  automount: false
  annotations: {}

# ---------------------------------------------------------------------------
# Security contexts.
#
# These are the chart-wide defaults; every component below can override them
# under its own `podSecurityContext` / `containerSecurityContext` key, and the
# two are merged with the component winning.
#
# The defaults are the settings that hold for every image here. Two are left to
# the components deliberately:
#
#   runAsNonRoot          Not all bundled images support it. Where a component
#                         sets it, the image is known to run unprivileged.
#   readOnlyRootFilesystem
#                         Requires knowing every path a container writes to.
#                         Enabled per component, each with the emptyDir mounts
#                         that make it work.
#
# Dropping ALL capabilities also removes CAP_NET_BIND_SERVICE, so a container
# listening below port 1024 must add it back. api and web do.
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: false
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

# ---------------------------------------------------------------------------
# Secrets — the chart creates a Secret from these values. To use your own
# Secret instead, set `existingSecret` to its name; it must contain keys:
#   mssql-sa-password, local-auth-jwt-signing-key, openbao-token, openai-api-key
# ---------------------------------------------------------------------------
secrets:
  existingSecret: ""
  mssqlSaPassword: ""              # REQUIRED (unless using existingSecret / external SQL)
  localAuthJwtSigningKey: ""       # REQUIRED for local login to survive restarts
  # Empty by default — set explicitly for bundled OpenBao, or use existingSecret.
  # Never leave "root" in production.
  openBaoToken: ""
  openAiApiKey: ""                 # optional (AI Insights)

# ---------------------------------------------------------------------------
# API (.NET Functions isolated worker). amd64-only image.
# ---------------------------------------------------------------------------
api:
  replicaCount: 1
  service:
    port: 80
  # Instance environment: Development disables live cloud collection.
  platformEnvironment: Development
  # Comma-separated browser origins. Set to your UI origin(s); avoid "*".
  corsAllowedOrigins: "http://localhost:3000"
  openAi:
    baseUrl: ""
    model: gpt-5.5
  entra:
    tenantId: ""
    clientId: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  # Listens on :80, so it needs NET_BIND_SERVICE back after the ALL drop.
  # The Functions host writes to /tmp; readOnlyRootFilesystem would need that
  # and the host's own writable paths mapped first.
  containerSecurityContext:
    capabilities:
      drop: ["ALL"]
      add: ["NET_BIND_SERVICE"]
  podSecurityContext: {}
  # Spread replicas across nodes when scaled past one.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Web (Next.js static export served by nginx; reverse-proxies /api).
# ---------------------------------------------------------------------------
web:
  replicaCount: 1
  service:
    port: 80
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # Runs as the image's own nginx user (101) rather than root. Doing that is what
  # makes dropping capabilities viable: as root, nginx chowns its cache directory
  # at startup and fails without CAP_CHOWN, so keeping root would mean handing
  # back CHOWN, SETUID, SETGID, and DAC_OVERRIDE — most of what the drop was for.
  #
  # fsGroup 101 is load-bearing: the emptyDir volumes below are root-owned
  # without it, and nginx cannot write its rendered config or its pid file.
  #
  # On binding :80 as uid 101 — this works because kubelet defaults
  # net.ipv4.ip_unprivileged_port_start to 0, not because of the capability
  # below. A non-root process gets no effective capabilities from
  # capabilities.add (measured: CapEff is 0), so NET_BIND_SERVICE only matters
  # if someone overrides runAsUser to 0. On a cluster that raises that sysctl,
  # move nginx to :8080 and repoint the Service rather than granting the
  # capability, which would not help here.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
  # readOnlyRootFilesystem is on, with every path nginx writes to mounted as
  # emptyDir in web.yaml. /etc/nginx/conf.d is one of them because the official
  # entrypoint runs envsubst over the template at startup and writes the result
  # there, so a read-only /etc/nginx fails before nginx starts.
  containerSecurityContext:
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
      add: ["NET_BIND_SERVICE"]
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: true
  className: ""
  host: cloudravel.local
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# ---------------------------------------------------------------------------
# Bundled dependencies. Disable one and fill its `external*` block to use a
# managed service instead.
# ---------------------------------------------------------------------------
mssql:
  enabled: true
  # Pinned rather than :latest so a redeploy cannot silently change the database
  # engine under a running install.
  image: mcr.microsoft.com/azure-sql-edge:1.0.7
  service:
    port: 1433
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }
  # The image already runs unprivileged as mssql; this asserts it rather than
  # trusting the image not to change. Note the group: mssql is uid 10001 but
  # gid 0, and /var/opt/mssql is drwxrwx--- root root, so the engine reaches its
  # own data directory through group root. Overriding runAsGroup to 10001 locks
  # it out of that directory.
  #
  # The engine writes throughout /var/opt/mssql, so the root filesystem stays
  # writable.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 0
    fsGroup: 0
  # NET_BIND_SERVICE is not about binding a port here. /opt/mssql/bin/sqlservr
  # carries the file capability cap_net_bind_service+ep, and the kernel refuses
  # to exec a binary whose effective file capability cannot be raised. Dropping
  # ALL without adding this back fails at startup with a bare
  # "sqlservr: Operation not permitted".
  containerSecurityContext:
    capabilities:
      drop: ["ALL"]
      add: ["NET_BIND_SERVICE"]

# Used only when mssql.enabled=false. The chart builds the api connection
# string and the migrator DB_HOST from these.
externalMssql:
  host: ""                         # e.g. sql.example.com
  port: 1433
  database: cloudraveldb
  user: sa                         # migrator/app login (uses secrets.mssqlSaPassword)

azurite:
  enabled: true
  image: mcr.microsoft.com/azure-storage/azurite:3.36.0
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # Listens on 10000-10002, all unprivileged, so no capabilities are needed.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext: {}

# Used only when azurite.enabled=false. Full AzureWebJobsStorage connection
# string for the Functions host (real Azure Storage or another emulator).
externalStorage:
  connectionString: ""

openbao:
  enabled: true
  image: docker.io/openbao/openbao:2.4.1
  service:
    port: 8200
  # mode: file (default) = file storage + auto-init/unseal entrypoint (persistent when
  #   persistence.enabled). Single replica only — not HA.
  # mode: dev = in-memory -dev server (secrets lost on restart; token from secrets.openBaoToken).
  mode: file
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # IPC_LOCK lets OpenBao mlock its memory so secrets are not paged to disk;
  # it is the one capability added back after the ALL drop.
  podSecurityContext: {}
  containerSecurityContext:
    capabilities:
      drop: ["ALL"]
      add: ["IPC_LOCK"]

# Used only when openbao.enabled=false.
externalOpenBao:
  address: ""                      # e.g. https://vault.example.com:8200
  # Optional path to a root/app token mounted into the API pod (preferred over embedding).
  tokenFile: ""

# Migration Job (runs as a Helm post-install/post-upgrade hook).
migrator:
  image: mcr.microsoft.com/mssql-tools:latest
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  podSecurityContext: {}
  containerSecurityContext: {}

# ---------------------------------------------------------------------------
# NetworkPolicy. Off by default because it silently breaks traffic on clusters
# with no CNI that enforces it, which is worse than not having it. Turn it on
# where the CNI does enforce (Calico, Cilium, and similar).
#
# When enabled: the database, storage, and secret store accept connections only
# from this release's own pods, and the api and web pods accept ingress-controller
# traffic. Everything keeps unrestricted egress, since the api must reach Azure,
# AWS, GCP, and the AI provider.
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: false
  # Namespaces allowed to reach api and web. Empty means any namespace, which
  # is the right default for an ingress controller in a namespace nobody can
  # name ahead of time.
  ingressNamespaceSelector: {}
