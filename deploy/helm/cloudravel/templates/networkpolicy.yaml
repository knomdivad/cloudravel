{{- if .Values.networkPolicy.enabled }}
{{- $fullName := include "cloudravel.fullname" . }}
{{- $releaseSelector := dict "matchLabels" (dict "app.kubernetes.io/name" (include "cloudravel.name" .) "app.kubernetes.io/instance" .Release.Name) }}
{{/*
Only meaningful on a CNI that enforces NetworkPolicy. Where nothing enforces it
these objects are accepted and ignored, which is why this is opt-in: a policy
that appears to be applied but is not is worse than no policy.

Shape: the backing services accept connections only from this release's own
pods; api and web accept ingress-controller traffic. Egress is unrestricted
throughout, because the api has to reach Azure, AWS, GCP, and the AI provider,
and enumerating those endpoints here would be a maintenance trap.
*/}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-web
  labels:
    {{- include "cloudravel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cloudravel.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressNamespaceSelector }}
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
        {{- else }}
        # Any namespace: an ingress controller's namespace is not knowable here.
        - namespaceSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: 80
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-api
  labels:
    {{- include "cloudravel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cloudravel.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml $releaseSelector.matchLabels | nindent 14 }}
        {{- if .Values.networkPolicy.ingressNamespaceSelector }}
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: 80
  # Unrestricted: cloud provider APIs, the AI endpoint, and DNS.
  egress:
    - {}
{{- range $component, $port := dict "mssql" 1433 "azurite" 10000 "openbao" 8200 }}
{{- $enabled := (index $.Values $component).enabled }}
{{- if $enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-{{ $component }}
  labels:
    {{- include "cloudravel.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cloudravel.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
  policyTypes: [Ingress]
  # Reachable only from this release. Nothing else in the cluster should be
  # talking to the database, the storage emulator, or the secret store.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "cloudravel.name" $ }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
{{- if eq $component "azurite" }}
      ports:
        - protocol: TCP
          port: 10000
        - protocol: TCP
          port: 10001
        - protocol: TCP
          port: 10002
{{- else }}
      ports:
        - protocol: TCP
          port: {{ $port }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
