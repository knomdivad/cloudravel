apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudravel.web.fullname" . }}
  labels:
    {{- include "cloudravel.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloudravel.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloudravel.selectorLabels" (dict "ctx" . "component" "web") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cloudravel.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with (include "cloudravel.podSecurityContext" (dict "ctx" . "component" "web")) }}
      securityContext:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "cloudravel.image" (dict "ctx" . "component" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with (include "cloudravel.containerSecurityContext" (dict "ctx" . "component" "web")) }}
          securityContext:
            {{- . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
          env:
            # nginx reverse-proxies /api to the API Service (envsubst at startup).
            - name: API_UPSTREAM
              value: "{{ include "cloudravel.api.fullname" . }}:{{ .Values.api.service.port }}"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          {{- if (include "cloudravel.containerSecurityContext" (dict "ctx" . "component" "web") | fromYaml).readOnlyRootFilesystem }}
          volumeMounts:
            # Everything the official nginx image writes to at runtime. conf.d is
            # here because the entrypoint runs envsubst over the template and
            # writes the rendered config there before nginx starts.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            # /run, not /var/run: on Alpine the latter is a symlink to the
            # former, and nginx.conf writes its pid to /run/nginx.pid.
            - name: nginx-run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
          {{- end }}
      {{- if (include "cloudravel.containerSecurityContext" (dict "ctx" . "component" "web") | fromYaml).readOnlyRootFilesystem }}
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudravel.web.fullname" . }}
  labels:
    {{- include "cloudravel.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "cloudravel.selectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
