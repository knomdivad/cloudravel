{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudravel.fullname" . }}-secrets
  labels:
    {{- include "cloudravel.labels" . | nindent 4 }}
type: Opaque
stringData:
  mssql-sa-password: {{ required "secrets.mssqlSaPassword is required (or set secrets.existingSecret)" .Values.secrets.mssqlSaPassword | quote }}
  local-auth-jwt-signing-key: {{ required "secrets.localAuthJwtSigningKey is required (or set secrets.existingSecret)" .Values.secrets.localAuthJwtSigningKey | quote }}
  {{- /* Bundled OpenBao dev mode needs a token; default to "root" only when enabled and unset. */}}
  openbao-token: {{ if .Values.secrets.openBaoToken }}{{ .Values.secrets.openBaoToken | quote }}{{ else if .Values.openbao.enabled }}"root"{{ else }}""{{ end }}
  openai-api-key: {{ .Values.secrets.openAiApiKey | quote }}
  azure-webjobs-storage: {{ include "cloudravel.storageConnectionString" . | quote }}
{{- end }}
