{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudravel.fullname" . }}-secrets
  labels:
    {{- include "cloudravel.labels" . | nindent 4 }}
type: Opaque
stringData:
  mssql-sa-password: {{ required "secrets.mssqlSaPassword is required (or set secrets.existingSecret)" .Values.secrets.mssqlSaPassword | quote }}
  local-auth-jwt-signing-key: {{ required "secrets.localAuthJwtSigningKey is required (or set secrets.existingSecret)" .Values.secrets.localAuthJwtSigningKey | quote }}
  {{- /*
    Bundled OpenBao in dev mode takes this as its root token, so an unset value
    used to fall back to "root" — a well-known credential on whatever the chart
    installed, with nothing in the output saying so. Dev mode now demands the
    token explicitly and fails the render without it.

    File mode is different: the entrypoint generates and persists its own root
    token, and this key is optional (see openbao.yaml, `optional: true`). Empty
    is correct there.
  */}}
  {{- if .Values.secrets.openBaoToken }}
  openbao-token: {{ .Values.secrets.openBaoToken | quote }}
  {{- else if and .Values.openbao.enabled (eq (.Values.openbao.mode | default "file") "dev") }}
  openbao-token: {{ required "secrets.openBaoToken is required when openbao.mode=dev (it becomes the OpenBao root token). Set it, use secrets.existingSecret, or switch to openbao.mode=file." .Values.secrets.openBaoToken | quote }}
  {{- else }}
  openbao-token: ""
  {{- end }}
  openai-api-key: {{ .Values.secrets.openAiApiKey | quote }}
  azure-webjobs-storage: {{ include "cloudravel.storageConnectionString" . | quote }}
{{- end }}
