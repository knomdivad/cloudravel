{{- if .Values.openbao.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudravel.openbao.fullname" . }}
  labels:
    {{- include "cloudravel.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cloudravel.selectorLabels" (dict "ctx" . "component" "openbao") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloudravel.selectorLabels" (dict "ctx" . "component" "openbao") | nindent 8 }}
    spec:
      containers:
        - name: openbao
          image: {{ .Values.openbao.image }}
          # Dev mode: in-memory, single unsealed node, fixed root token. EPHEMERAL
          # — secrets are lost on restart. Disable this and use externalOpenBao
          # (a real Vault/OpenBao) for production.
          args:
            - server
            - -dev
            - -dev-listen-address=0.0.0.0:8200
          env:
            - name: BAO_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloudravel.secretName" . }}
                  key: openbao-token
            - name: BAO_ADDR
              value: http://0.0.0.0:8200
          ports:
            - name: http
              containerPort: 8200
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.openbao.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudravel.openbao.fullname" . }}
  labels:
    {{- include "cloudravel.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
spec:
  type: ClusterIP
  selector:
    {{- include "cloudravel.selectorLabels" (dict "ctx" . "component" "openbao") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.openbao.service.port }}
      targetPort: http
{{- end }}
