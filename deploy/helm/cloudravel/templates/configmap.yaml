apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudravel.fullname" . }}-config
  labels:
    {{- include "cloudravel.labels" . | nindent 4 }}
data:
  FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
  Platform__Environment: {{ .Values.api.platformEnvironment | quote }}
  OpenBao__Address: {{ include "cloudravel.openBaoAddress" . | quote }}
  SecretStore__Provider: "OpenBao"
  Cors__AllowedOrigins: {{ .Values.api.corsAllowedOrigins | quote }}
  OpenAI__BaseUrl: {{ .Values.api.openAi.baseUrl | quote }}
  OpenAI__Model: {{ .Values.api.openAi.model | quote }}
  AzureAd__TenantId: {{ .Values.api.entra.tenantId | quote }}
  AzureAd__ClientId: {{ .Values.api.entra.clientId | quote }}
  # Change-polling / sync timers hit live cloud APIs — off by default (parity
  # with the compose stack). The internal inventory + DB-driven timers stay on.
  AzureWebJobs.PollChangesTimer.Disabled: "true"
  AzureWebJobs.SyncAdvisorTimer.Disabled: "true"
  AzureWebJobs.SyncPolicyTimer.Disabled: "true"
  AzureWebJobs.SyncDefenderTimer.Disabled: "true"
