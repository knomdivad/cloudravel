{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloudravel.serviceAccountName" . }}
  labels:
    {{- include "cloudravel.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# None of these workloads call the Kubernetes API, so the token is not projected
# into the pods. Anything that reaches a pod therefore finds no cluster
# credential to reuse.
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
