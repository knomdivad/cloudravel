name: CloudRavel — Security Scanning

# CloudRavel brokers customer cloud credentials, so the supply chain around it is
# part of its attack surface. This workflow covers the five classes the build
# pipeline did not: static analysis, vulnerable dependencies, committed secrets,
# insecure infrastructure-as-code, and vulnerable base images.
#
# Findings are reported to the Security tab rather than failing the build. A
# scanner switched on over an existing codebase always has a backlog, and a gate
# that is red on arrival gets ignored or bypassed. Burn the backlog down first,
# then tighten the thresholds here.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Weekly, so newly disclosed CVEs surface against unchanged code.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'
  FRONTEND_PATH: src/frontend

jobs:
  # ============================================================================
  # Static analysis
  # ============================================================================
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # The Functions worker generates a project during build, so autobuild is
      # unreliable here; drive the same restore/build the pipeline uses.
      - name: Build (C#)
        if: matrix.language == 'csharp'
        run: |
          dotnet restore CloudRavel.sln --locked-mode
          dotnet build CloudRavel.sln --configuration Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}

  # ============================================================================
  # Vulnerable dependencies
  # ============================================================================
  dependencies:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/package-lock.json

      - name: Restore
        run: dotnet restore CloudRavel.sln --locked-mode

      # Transitive included: a vulnerable package pulled in by a direct one is
      # still shipped in the image.
      - name: NuGet vulnerability report
        id: nuget
        run: |
          dotnet list CloudRavel.sln package --vulnerable --include-transitive \
            | tee /tmp/nuget-vulns.txt
          if grep -qiE '(Critical|High)' /tmp/nuget-vulns.txt; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deprecated NuGet packages
        continue-on-error: true
        run: dotnet list CloudRavel.sln package --deprecated

      - name: npm audit
        id: npm
        working-directory: ${{ env.FRONTEND_PATH }}
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high | tee /tmp/npm-audit.txt || echo "found=true" >> "$GITHUB_OUTPUT"

      # Surfaced in the job summary so the backlog is visible without failing the
      # run. Flip these to a hard failure once the existing findings are cleared.
      - name: Summarize
        if: always()
        run: |
          {
            echo "## Dependency audit"
            echo
            if [ "${{ steps.nuget.outputs.found }}" = "true" ]; then
              echo "### NuGet: high or critical advisories present"
            else
              echo "### NuGet: no high or critical advisories"
            fi
            echo '```'
            cat /tmp/nuget-vulns.txt 2>/dev/null | tail -40
            echo '```'
            if [ "${{ steps.npm.outputs.found }}" = "true" ]; then
              echo "### npm: advisories at or above high"
            else
              echo "### npm: clean at the high threshold"
            fi
            echo '```'
            cat /tmp/npm-audit.txt 2>/dev/null | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Blocks only what a pull request newly introduces, so it can be strict without
  # inheriting the existing backlog.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ============================================================================
  # Committed secrets
  # ============================================================================
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a key removed in a later commit is still disclosed.
          fetch-depth: 0

      # Known finding on adoption: infra/terraform/tfplan.json was committed in
      # f746912 and removed in d85450f, but the blob is still reachable from
      # history and contains a real SQL administrator password. The path is
      # gitignored now. Clearing this needs the credential rotated, and only
      # then a history rewrite; see SECURITY.md.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  # ============================================================================
  # Infrastructure as code
  # ============================================================================
  iac:
    name: IaC Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Covers Terraform, the Helm chart, the Dockerfiles, and compose in one pass.
      - name: Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@5659ddea96102e16d8f221b3d8402453c0b1c150 # v12.3121.0
        with:
          directory: .
          framework: terraform,helm,dockerfile,github_actions
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true
          skip_check: CKV_DOCKER_2  # HEALTHCHECK is provided by compose and Kubernetes probes

      - name: Upload Checkov SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: checkov.sarif
          category: checkov

  # ============================================================================
  # Container images
  # ============================================================================
  # Built here rather than pulled: this must scan what the pull request would
  # produce, not what was last published.
  images:
    name: Image Scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: src/backend
          - component: web
            context: src/frontend
          - component: migrator
            context: database
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          load: true
          tags: cloudravel-${{ matrix.component }}:scan
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cloudravel-${{ matrix.component }}:scan
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.component)) != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}
