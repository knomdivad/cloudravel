name: CloudRavel — Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - orbstack-integration
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  packages: write

# One run per ref. Superseded pull request pushes are cancelled; runs on main and
# on tags are not, because their images and charts get published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'
  BACKEND_PATH: src/backend
  FRONTEND_PATH: src/frontend
  # Container images + Helm chart are published to GHCR under the repo owner.
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  # ============================================================================
  # Backend Build & Test
  # ============================================================================
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Locked mode fails the build if the resolved graph differs from
      # packages.lock.json, so a transitive dependency cannot change without the
      # lock file changing in the same commit.
      - name: Restore dependencies
        run: dotnet restore CloudRavel.sln --locked-mode

      # Checked against .editorconfig, which encodes the style already in use.
      - name: Format check
        run: dotnet format CloudRavel.sln --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build CloudRavel.sln --configuration Release --no-restore -p:SourceRevisionId=${{ github.sha }}

      - name: Test
        run: >-
          dotnet test CloudRavel.sln --configuration Release --no-build --verbosity normal
          --collect:"XPlat Code Coverage" --results-directory ./.coverage

      # No threshold yet: establish a baseline before it can be ratcheted.
      # Reports appear once coverlet.collector is referenced by the test project;
      # without it the collector emits nothing, hence warn rather than error.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: ./.coverage/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Publish API
        run: dotnet publish ${{ env.BACKEND_PATH }}/CloudRavel.Api/CloudRavel.Api.csproj --configuration Release --output ./publish/api --no-build

      - name: Upload API artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-package
          path: ./publish/api
          include-hidden-files: true
          retention-days: 7

  # ============================================================================
  # Frontend Build
  # ============================================================================
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm ci

      - name: Lint
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm run lint

      # next build reports type errors, but only for files it reaches. A standalone
      # tsc covers the whole project, including anything the bundler prunes.
      - name: Typecheck
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm run typecheck

      - name: Content checks
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm run test:help

      - name: Build
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://func-cloudravel-dev.azurewebsites.net/api' }}
          NEXT_PUBLIC_AZURE_AD_CLIENT_ID: ${{ vars.AZURE_AD_CLIENT_ID }}
          NEXT_PUBLIC_AZURE_AD_TENANT_ID: ${{ vars.AZURE_AD_TENANT_ID }}
          NEXT_PUBLIC_API_SCOPE: api://cloudravel-api/access_as_user

      - name: Upload frontend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-package
          path: ${{ env.FRONTEND_PATH }}/out
          retention-days: 7

  # ============================================================================
  # Terraform Validation
  # ============================================================================
  infra-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '~> 1.9'

      - name: Terraform Format Check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra/terraform
        run: terraform validate

  # ============================================================================
  # Container images → GHCR (the Kubernetes deployment path)
  # Builds and pushes api, web, and migrator. amd64 only: the Functions base
  # image (api) ships no arm64 manifest.
  # ============================================================================
  images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Publishing is not a merge gate. A pull request must never push to GHCR, and
    # a fork's token has no packages:write to push with anyway.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write      # cosign keyless signing via OIDC
      attestations: write  # build provenance
    strategy:
      matrix:
        include:
          - component: api
            context: src/backend
          - component: web
            context: src/frontend
          - component: migrator
            context: database
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/cloudravel-${{ matrix.component }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push ${{ matrix.component }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only the backend Dockerfile consumes GIT_SHA (stamps the UI version);
          # harmless for the others (unused ARG).
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Everything below addresses the same image by digest, never by tag: tags
      # are mutable, and a signature or SBOM attached to a tag proves nothing
      # about what that tag points at later.
      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/cloudravel-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/cloudravel-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.component }}.spdx.json
          output-file: sbom-${{ matrix.component }}.spdx.json

      # Keyless: identity comes from the workflow's OIDC token and is recorded in
      # the public transparency log, so there is no signing key to store or leak.
      - name: Sign image
        run: |
          cosign sign --yes \
            "${REGISTRY}/${NAMESPACE}/cloudravel-${COMPONENT}@${DIGEST}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Attach SBOM attestation
        run: |
          cosign attest --yes --predicate "sbom-${COMPONENT}.spdx.json" --type spdxjson \
            "${REGISTRY}/${NAMESPACE}/cloudravel-${COMPONENT}@${DIGEST}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}

  # ============================================================================
  # Helm chart → GHCR (OCI) + workflow artifact
  # ============================================================================
  # Linting the chart IS a merge gate, so it runs on pull requests; only the
  # publish steps below are skipped there.
  chart:
    name: Package & Publish Helm Chart
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.4

      - name: Helm lint
        run: helm lint deploy/helm/cloudravel --set secrets.mssqlSaPassword=x --set secrets.localAuthJwtSigningKey=y

      - name: Helm template
        run: helm template cloudravel deploy/helm/cloudravel --set secrets.mssqlSaPassword=x --set secrets.localAuthJwtSigningKey=y > /dev/null

      - name: Helm package
        run: helm package deploy/helm/cloudravel --destination ./.chart

      - name: Upload chart artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helm-chart
          path: ./.chart/*.tgz
          retention-days: 7

      - name: Log in to GHCR (Helm OCI)
        if: github.event_name != 'pull_request'
        run: helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR
        if: github.event_name != 'pull_request'
        run: helm push ./.chart/*.tgz oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/charts
