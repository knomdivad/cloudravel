name: CloudRavel — Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - orbstack-integration
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  packages: write

# One run per ref. Superseded pull request pushes are cancelled; runs on main and
# on tags are not, because their images and charts get published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'
  BACKEND_PATH: src/backend
  FRONTEND_PATH: src/frontend
  # Container images + Helm chart are published to GHCR under the repo owner.
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  # ============================================================================
  # Backend Build & Test
  # ============================================================================
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore CloudRavel.sln

      # Checked against .editorconfig, which encodes the style already in use.
      - name: Format check
        run: dotnet format CloudRavel.sln --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build CloudRavel.sln --configuration Release --no-restore -p:SourceRevisionId=${{ github.sha }}

      - name: Test
        run: >-
          dotnet test CloudRavel.sln --configuration Release --no-build --verbosity normal
          --collect:"XPlat Code Coverage" --results-directory ./.coverage

      # No threshold yet: establish a baseline before it can be ratcheted.
      # Reports appear once coverlet.collector is referenced by the test project;
      # without it the collector emits nothing, hence warn rather than error.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ./.coverage/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Publish API
        run: dotnet publish ${{ env.BACKEND_PATH }}/CloudRavel.Api/CloudRavel.Api.csproj --configuration Release --output ./publish/api --no-build

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-package
          path: ./publish/api
          include-hidden-files: true
          retention-days: 7

  # ============================================================================
  # Frontend Build
  # ============================================================================
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm ci

      - name: Lint
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm run lint

      # next build reports type errors, but only for files it reaches. A standalone
      # tsc covers the whole project, including anything the bundler prunes.
      - name: Typecheck
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm run typecheck

      - name: Content checks
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm run test:help

      - name: Build
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://func-cloudravel-dev.azurewebsites.net/api' }}
          NEXT_PUBLIC_AZURE_AD_CLIENT_ID: ${{ vars.AZURE_AD_CLIENT_ID }}
          NEXT_PUBLIC_AZURE_AD_TENANT_ID: ${{ vars.AZURE_AD_TENANT_ID }}
          NEXT_PUBLIC_API_SCOPE: api://cloudravel-api/access_as_user

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package
          path: ${{ env.FRONTEND_PATH }}/out
          retention-days: 7

  # ============================================================================
  # Terraform Validation
  # ============================================================================
  infra-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.9'

      - name: Terraform Format Check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra/terraform
        run: terraform validate

  # ============================================================================
  # Container images → GHCR (the Kubernetes deployment path)
  # Builds and pushes api, web, and migrator. amd64 only: the Functions base
  # image (api) ships no arm64 manifest.
  # ============================================================================
  images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Publishing is not a merge gate. A pull request must never push to GHCR, and
    # a fork's token has no packages:write to push with anyway.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: api
            context: src/backend
          - component: web
            context: src/frontend
          - component: migrator
            context: database
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/cloudravel-${{ matrix.component }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only the backend Dockerfile consumes GIT_SHA (stamps the UI version);
          # harmless for the others (unused ARG).
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Helm chart → GHCR (OCI) + workflow artifact
  # ============================================================================
  # Linting the chart IS a merge gate, so it runs on pull requests; only the
  # publish steps below are skipped there.
  chart:
    name: Package & Publish Helm Chart
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Helm lint
        run: helm lint deploy/helm/cloudravel --set secrets.mssqlSaPassword=x --set secrets.localAuthJwtSigningKey=y

      - name: Helm template
        run: helm template cloudravel deploy/helm/cloudravel --set secrets.mssqlSaPassword=x --set secrets.localAuthJwtSigningKey=y > /dev/null

      - name: Helm package
        run: helm package deploy/helm/cloudravel --destination ./.chart

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: ./.chart/*.tgz
          retention-days: 7

      - name: Log in to GHCR (Helm OCI)
        if: github.event_name != 'pull_request'
        run: helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR
        if: github.event_name != 'pull_request'
        run: helm push ./.chart/*.tgz oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/charts
