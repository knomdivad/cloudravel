name: CloudRavel — Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      build_run_id:
        description: 'Build workflow run ID (leave blank to use latest successful build)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

env:
  AZURE_RESOURCE_GROUP: rg-cloudravel-${{ inputs.environment || 'dev' }}
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}

jobs:
  # ============================================================================
  # Resolve Build Artifacts
  # ============================================================================
  resolve-build:
    name: Resolve Build Run
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Resolve build run ID
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.build_run_id }}" ]; then
            echo "run_id=${{ inputs.build_run_id }}" >> "$GITHUB_OUTPUT"
            echo "Using provided build run ID: ${{ inputs.build_run_id }}"
          else
            RUN_ID=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/build.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].id')
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "::error::No successful build runs found. Run the Build workflow first."
              exit 1
            fi
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "Using latest successful build run ID: $RUN_ID"
          fi

  # ============================================================================
  # Terraform Plan (runs without approval)
  # ============================================================================
  plan-infra:
    name: Terraform Plan
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_environment: ${{ inputs.environment || 'dev' }}
      TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.9'
          terraform_wrapper: false

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init

      # Reconcile state with Azure — import any resources that exist in
      # Azure but are missing from state (e.g. after a partial apply that
      # was followed by a manual state cleanup or RG re-creation).
      # Every import is best-effort; failures are silently ignored.
      - name: Reconcile state with Azure
        working-directory: infra/terraform
        run: |
          set +e

          # Resolve the random hex suffix that was persisted on the very first apply.
          HEX=$(terraform state show random_id.unique 2>/dev/null \
                | grep '^\s*hex\s' | awk -F'"' '{print $2}')
          if [ -z "$HEX" ]; then
            echo "random_id.unique not yet in state — first deploy, nothing to import"
            exit 0
          fi

          SUFFIX="cloudravel-${TF_VAR_environment}"
          UNIQUE="cloudravel${HEX}"
          SUB="${ARM_SUBSCRIPTION_ID}"
          RG="rg-${SUFFIX}"

          import_if_missing() {
            local ADDR="$1"
            local ID="$2"
            if terraform state show "${ADDR}" &>/dev/null; then
              echo "  ✓ ${ADDR} already in state"
            else
              echo "  ⟳ importing ${ADDR} ..."
              terraform import "${ADDR}" "${ID}" 2>&1 \
                || echo "    ↳ skipped (resource may not exist in Azure)"
            fi
          }

          echo "--- Diagnostic settings ---"
          KV_RID="/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.KeyVault/vaults/kv-${UNIQUE}"
          import_if_missing \
            "module.monitoring.azurerm_monitor_diagnostic_setting.key_vault" \
            "${KV_RID}|diag-kv-${SUFFIX}"

          SB_RID="/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.ServiceBus/namespaces/sb-${SUFFIX}"
          import_if_missing \
            "module.monitoring.azurerm_monitor_diagnostic_setting.servicebus" \
            "${SB_RID}|diag-sb-${SUFFIX}"

          SQL_RID="/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.Sql/servers/sql-${UNIQUE}/databases/cloudraveldb"
          import_if_missing \
            "module.monitoring.azurerm_monitor_diagnostic_setting.sql_database" \
            "${SQL_RID}|diag-sql-${SUFFIX}"

          # NOTE: azapi_resource.ai_hub / ai_project are NOT imported here.
          # The azapi provider has a known bug where it cannot read
          # MachineLearningServices/workspaces back after import, causing
          # "Missing Resource Identity After Read" during plan.
          # These resources are created fresh by Terraform on each deploy.

          exit 0   # always succeed — imports are best-effort

      - name: Terraform Plan
        working-directory: infra/terraform
        run: |
          terraform plan -out=tfplan -input=false
          terraform show -no-color tfplan > tfplan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment || 'dev' }}
          path: |
            infra/terraform/tfplan
            infra/terraform/tfplan.txt
          retention-days: 7

      - name: Post plan summary
        run: |
          echo "### Terraform Plan — ${{ inputs.environment || 'dev' }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat infra/terraform/tfplan.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # Terraform Apply (requires environment approval)
  # ============================================================================
  deploy-infra:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan-infra
    environment: ${{ inputs.environment || 'dev' }}
    outputs:
      functionAppName: ${{ steps.tf-output.outputs.functionAppName }}
      staticWebAppName: ${{ steps.tf-output.outputs.staticWebAppName }}
      staticWebAppHostname: ${{ steps.tf-output.outputs.staticWebAppHostname }}
      sqlServerFqdn: ${{ steps.tf-output.outputs.sqlServerFqdn }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_environment: ${{ inputs.environment || 'dev' }}
      TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.9'
          terraform_wrapper: false

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment || 'dev' }}
          path: infra/terraform

      - name: Terraform Apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve -input=false tfplan

      - name: Capture Terraform Outputs
        id: tf-output
        working-directory: infra/terraform
        run: |
          echo "functionAppName=$(terraform output -raw function_app_name)" >> "$GITHUB_OUTPUT"
          echo "staticWebAppName=$(terraform output -raw static_web_app_name)" >> "$GITHUB_OUTPUT"
          echo "staticWebAppHostname=$(terraform output -raw static_web_app_url)" >> "$GITHUB_OUTPUT"
          echo "sqlServerFqdn=$(terraform output -raw sql_server_fqdn)" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # Deploy Backend (Function App)
  # ============================================================================
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [deploy-infra, resolve-build]
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-package
          path: ./api-package
          run-id: ${{ needs.resolve-build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.deploy-infra.outputs.functionAppName }}
          package: ./api-package

  # ============================================================================
  # Deploy Frontend (Static Web App)
  # ============================================================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [deploy-infra, resolve-build]
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Verify frontend artifact exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACTS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ needs.resolve-build.outputs.run_id }}/artifacts" --jq '.artifacts[].name')
          if ! echo "$ARTIFACTS" | grep -qx "frontend-package"; then
            echo "::error::Artifact 'frontend-package' not found in build run ${{ needs.resolve-build.outputs.run_id }}."
            echo "::error::Available artifacts: $ARTIFACTS"
            echo "::error::The frontend job in the build workflow likely failed. Check the build run for details."
            exit 1
          fi

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-package
          path: ./frontend-package
          run-id: ${{ needs.resolve-build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get SWA deployment token
        id: swa-token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "${{ needs.deploy-infra.outputs.staticWebAppName }}" \
            --resource-group "rg-cloudravel-${{ inputs.environment || 'dev' }}" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          action: upload
          app_location: ./frontend-package
          skip_app_build: true

  # ============================================================================
  # Post-deployment: Run DB Migrations
  # ============================================================================
  deploy-database:
    name: Apply Database Schema
    runs-on: ubuntu-latest
    needs: deploy-infra
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run SQL schema
        uses: azure/sql-action@v2
        with:
          connection-string: Server=tcp:${{ needs.deploy-infra.outputs.sqlServerFqdn }},1433;Initial Catalog=cloudraveldb;User ID=cloudraveladmin;Password=${{ secrets.SQL_ADMIN_PASSWORD }};Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;
          path: database/001-schema.sql
